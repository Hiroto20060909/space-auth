<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宇宙船認証システム</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Arial, Helvetica, sans-serif;
}

body {
  background:
    radial-gradient(circle at 80% 35%, rgba(0,140,255,.25), transparent 28%),
    linear-gradient(180deg, #07111f 0%, #020710 60%, #000 100%);
  color: white;
}

/* 星空 */
.stars {
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: .5;
  background-image:
    radial-gradient(circle, white 1px, transparent 1px),
    radial-gradient(circle, #5fd8ff 1px, transparent 1px);
  background-size: 90px 90px, 140px 140px;
  background-position: 0 0, 40px 30px;
}

/* 惑星 */
.planet {
  position: fixed;
  width: 620px;
  height: 620px;
  top: 40px;
  right: -170px;
  border-radius: 50%;
  background:
    radial-gradient(circle at 30% 28%,
      #79ddff 0%,
      #1978b0 18%,
      #07385d 43%,
      #011522 68%,
      #000 74%);
  box-shadow:
    -25px 0 70px rgba(57,183,255,.45),
    inset 40px -30px 90px #000;
  opacity: .7;
}

/* 宇宙船上部 */
.top-frame {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 72px;
  background: linear-gradient(180deg, #152130, #07101a);
  border-bottom: 2px solid #183a57;
  box-shadow: 0 8px 30px #000;
}

.top-frame::after {
  content: "";
  position: absolute;
  left: 37%;
  bottom: 8px;
  width: 26%;
  height: 4px;
  background: #61d8ff;
  box-shadow:
    0 0 12px #00b7ff,
    0 0 25px #00b7ff;
}

/* 左上ステータス */
.status-box {
  position: fixed;
  top: 105px;
  left: 5%;
  width: 225px;
  z-index: 5;
  color: #9ce8ff;
  font-size: 12px;
  letter-spacing: 1.5px;
}

.status-title {
  margin-bottom: 15px;
  font-size: 14px;
  letter-spacing: 2px;
}

.status-row {
  display: flex;
  justify-content: space-between;
  padding: 5px 0;
  border-bottom: 1px solid rgba(80,190,255,.18);
}

.ok {
  color: #00ffad;
}

/* メイン */
.main {
  position: relative;
  z-index: 10;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* 認証パネル */
.panel {
  width: min(760px, 84vw);
  padding: 58px 65px 48px;
  text-align: center;

  background:
    linear-gradient(
      180deg,
      rgba(4,25,47,.84),
      rgba(1,10,24,.94)
    );

  border: 2px solid #67dbff;

  clip-path: polygon(
    4% 0,
    96% 0,
    100% 7%,
    100% 93%,
    96% 100%,
    4% 100%,
    0 93%,
    0 7%
  );

  box-shadow:
    0 0 18px #00aaff,
    0 0 55px rgba(0,160,255,.32),
    inset 0 0 35px rgba(0,120,255,.18);
}

.title {
  margin: 0;
  font-size: clamp(34px, 5vw, 60px);
  letter-spacing: 6px;
  color: #eefcff;

  text-shadow:
    0 0 8px #fff,
    0 0 18px #00aeff,
    0 0 38px #008cff;
}

.subtitle {
  margin-top: 10px;
  color: #a9e4ff;
  letter-spacing: 7px;
  font-size: 14px;
}

.line {
  width: 88%;
  height: 1px;
  margin: 35px auto;
  background:
    linear-gradient(
      90deg,
      transparent,
      #62d9ff,
      transparent
    );
  box-shadow: 0 0 10px #00aaff;
}

.guide {
  margin-bottom: 25px;
  color: #c9efff;
  font-size: 20px;
  letter-spacing: 2px;
}

/* 入力欄 */
.password-input {
  width: 82%;
  height: 72px;

  padding-left: 18px;

  text-align: center;
  font-size: 36px;
  letter-spacing: 18px;

  color: white;
  background: rgba(0,13,28,.88);

  border: 2px solid #63d9ff;
  border-radius: 6px;
  outline: none;

  box-shadow:
    0 0 15px rgba(0,195,255,.7),
    inset 0 0 20px rgba(0,120,255,.2);
}

.password-input:focus {
  border-color: white;
  box-shadow:
    0 0 10px white,
    0 0 30px #00aaff,
    inset 0 0 22px rgba(0,170,255,.25);
}

/* ENTER */
.enter-button {
  display: block;
  width: 66%;
  height: 72px;
  margin: 35px auto 0;

  color: white;
  font-size: 27px;
  font-weight: bold;
  letter-spacing: 8px;

  border: 2px solid #76e1ff;

  background:
    linear-gradient(
      180deg,
      rgba(0,145,230,.58),
      rgba(0,47,91,.95)
    );

  clip-path: polygon(
    8% 0,
    92% 0,
    100% 28%,
    100% 72%,
    92% 100%,
    8% 100%,
    0 72%,
    0 28%
  );

  box-shadow:
    0 0 18px #00aaff,
    inset 0 0 20px rgba(0,145,255,.7);

  text-shadow: 0 0 10px white;
  cursor: pointer;
  transition: .15s;
}

.enter-button:hover {
  background: #0b91d0;
  box-shadow:
    0 0 18px white,
    0 0 40px #00aaff;
}

.enter-button:active {
  transform: scale(.97);
}

.footer-text {
  margin-top: 26px;
  color: #8ad9ff;
  font-size: 11px;
  letter-spacing: 5px;
}

/* 下部フレーム */
.bottom-frame {
  position: fixed;
  left: 0;
  bottom: 0;
  width: 100%;
  height: 105px;
  background:
    linear-gradient(
      90deg,
      #050a11,
      #142437 25%,
      #07101a 50%,
      #142437 75%,
      #050a11
    );
  border-top: 2px solid #284d6d;
  box-shadow: 0 -12px 35px #000;
}

/* スキャン演出 */
.scan-line {
  position: fixed;
  left: 0;
  width: 100%;
  height: 2px;
  z-index: 20;
  pointer-events: none;

  background: rgba(92,220,255,.2);
  box-shadow: 0 0 12px #00aaff;

  animation: scan 5s linear infinite;
}

@keyframes scan {
  from {
    top: 0%;
  }
  to {
    top: 100%;
  }
}

@media (max-width: 700px) {
  .status-box {
    display: none;
  }

  .planet {
    width: 430px;
    height: 430px;
    right: -210px;
  }

  .panel {
    width: 92vw;
    padding: 42px 20px;
  }

  .password-input {
    width: 92%;
  }

  .enter-button {
    width: 82%;
  }
}
</style>
</head>

<body>

<div class="stars"></div>
<div class="planet"></div>
<div class="top-frame"></div>
<div class="bottom-frame"></div>
<div class="scan-line"></div>

<div class="status-box">

  <div class="status-title">
    SPACECRAFT SYSTEM — VER.1.0
  </div>

  <div class="status-row">
    <span>LIFE SUPPORT</span>
    <span class="ok">OK</span>
  </div>

  <div class="status-row">
    <span>NAVIGATION</span>
    <span class="ok">OK</span>
  </div>

  <div class="status-row">
    <span>COMMUNICATION</span>
    <span class="ok">OK</span>
  </div>

  <div class="status-row">
    <span>ENGINE</span>
    <span class="ok">OK</span>
  </div>

  <div class="status-row">
    <span>SECURITY</span>
    <span>STANDBY</span>
  </div>

</div>

<main class="main">

  <section class="panel">

    <h1 class="title">
      ACCESS CONTROL
    </h1>

    <div class="subtitle">
      SECURITY LOCK SYSTEM
    </div>

    <div class="line"></div>

    <div class="guide">
      パスワードを入力してください
    </div>

    <form id="passwordForm">

      <input
        id="password"
        class="password-input"
        type="password"
        maxlength="4"
        inputmode="numeric"
        autocomplete="off"
        autofocus
        required
      >

      <button
        class="enter-button"
        type="submit">
        ENTER
      </button>

    </form>

    <div class="footer-text">
      SPACECRAFT SECURITY SYSTEM
    </div>

  </section>

</main>

<script>

const correctPassword = "3411";

const form = document.getElementById("passwordForm");
const passwordInput = document.getElementById("password");

passwordInput.addEventListener("input", function () {
  this.value = this.value.replace(/[^0-9]/g, "");
});

form.addEventListener("submit", function (event) {

  event.preventDefault();

  const inputPassword = passwordInput.value;

  if (inputPassword === correctPassword) {
    window.location.href = "success.html";
  } else {
    window.location.href = "failed.html";
  }

});

</script>

</body>
</html>
