<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>認証成功</title>

<style>

body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
        radial-gradient(circle,#003300,#000);
    color:white;
    font-family:Arial,sans-serif;
}

.panel{
    text-align:center;
    border:3px solid #00ff88;
    padding:50px;
    border-radius:20px;
    box-shadow:0 0 40px #00ff88;
}

h1{
    font-size:60px;
    color:#00ff88;
    text-shadow:
        0 0 10px #00ff88,
        0 0 30px #00ff88;
}

p{
    font-size:24px;
}

</style>
</head>

<body>

<div class="panel">

    <h1>AUTHENTICATION SUCCESS</h1>

    <p>認証成功</p>

    <p>システムロック解除</p>

</div>


<!-- 成功時の音声 -->
<audio id="successSound" preload="auto">
    <source src="success.mp3" type="audio/mpeg">
</audio>


<script>

window.addEventListener("load", function(){

    const successSound =
        document.getElementById("successSound");

    successSound.volume = 1;

    successSound.play()
        .then(function(){
            console.log("成功音声を再生しました");
        })
        .catch(function(error){
            console.log("自動再生できませんでした:", error);
        });

});

</script>

</body>
</html>
